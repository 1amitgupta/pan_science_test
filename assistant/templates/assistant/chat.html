{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>{{ org.name }} — Assistant</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{% static 'css/chat.css' %}?v=3" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="card chat-card border-0 rounded-0" id="chat" data-api-url="{% url 'assistant:api_ask' %}" data-token="{{ token }}">
    <div class="card-header bg-primary text-white">
      <div class="fw-semibold">{{ org.name }}</div>
      <div class="small opacity-75">Ask a question about our documents</div>
    </div>
    <div class="card-body chat-messages" id="chat-messages" aria-live="polite">
      <div class="msg msg-bot"><div class="bubble">Hi! How can I help you today?</div></div>
    </div>
    <div class="card-footer bg-white">
      <form id="chat-form" class="d-flex gap-2" autocomplete="off">
        <label for="chat-input" class="visually-hidden">Your question</label>
        <input type="text" class="form-control" id="chat-input" maxlength="1000" placeholder="Type your question…" required>
        <button type="submit" class="btn btn-primary" id="chat-send">Send</button>
      </form>
    </div>
  </div>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="{% static 'js/chat.js' %}?v=3"></script>
</body>
</html>
