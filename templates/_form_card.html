<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card shadow-sm">
      <div class="card-body">
        <h1 class="h4 mb-3">{{ heading }}</h1>
        <form method="post" novalidate>
          {% csrf_token %}
          {% for error in form.non_field_errors %}<div class="alert alert-danger">{{ error }}</div>{% endfor %}
          {% for field in form %}
            <div class="mb-3">
              <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
              {{ field }}
              {% for error in field.errors %}<div class="text-danger small mt-1">{{ error }}</div>{% endfor %}
            </div>
          {% endfor %}
          <button type="submit" class="btn btn-primary w-100">{{ submit_label }}</button>
        </form>
        <p class="text-center small mt-3 mb-0"><a href="{{ alt_url }}">{{ alt_label }}</a></p>
      </div>
    </div>
  </div>
</div>
